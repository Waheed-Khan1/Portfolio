<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Page</title>
<style>
  :root{
    --bg:#141414;
    --text:#f2f2f2;
    --muted:#a8a8a8;
    --line:#3a3a3a;
    --gold:#c9a15a;
    --blue:#4aa3ff;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Arial, sans-serif;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:22px 60px;
    border-bottom:1px solid #232323;
  }

  .Nav-links{
    display:flex;
    gap:36px;
  }

  .Nav-links a{
    color:var(--text);
    text-decoration:none;
    font-size:15px;
    opacity:.85;
  }

  .Nav-links a:hover{ opacity:1; }

  .hire-btn{
    color:var(--bg);
    background:var(--text);
    text-decoration:none;
    padding:10px 22px;
    font-size:14px;
    font-weight:600;
    border-radius:2px;
  }

  /* ---------- Contact Section ---------- */

  .contact{
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:60px;
    max-width:1100px;
    margin:100px auto;
    padding:0 40px;
  }

  /* Left: form */

  .contact-form{
    display:flex;
    flex-direction:column;
    gap:34px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .field label{
    font-size:14px;
    color:var(--muted);
  }

  .field input,
  .field textarea{
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--text);
    font-size:15px;
    padding:6px 2px;
    font-family:inherit;
    resize:vertical;
    min-height:24px;
  }

  .field input:focus,
  .field textarea:focus{
    outline:none;
    border-bottom-color:var(--gold);
  }

  .submit-btn{
    position:relative;
    margin-top:10px;
    padding:16px 20px;
    background:#fff;
    color:#141414;
    font-size:13px;
    font-weight:700;
    letter-spacing:1.5px;
    border:none;
    cursor:pointer;
  }

  .submit-btn::before{
    content:"";
    position:absolute;
    inset:0;
    padding:2px;
    border-radius:2px;
    background:linear-gradient(90deg,#ff8a3d,#4aa3ff);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    z-index:-1;
  }

  .submit-btn:hover{ filter:brightness(0.96); }

  /* Right: heading */

  .contact-info{
    position:relative;
    padding:40px 20px;
  }

  .squiggle{
    position:absolute;
    top:-40px;
    left:-40px;
    width:380px;
    height:420px;
    opacity:.5;
    z-index:0;
  }

  .contact-info h2{
    position:relative;
    z-index:1;
    font-size:56px;
    font-weight:600;
    line-height:1.15;
  }

  .contact-info h2 .accent{
    color:var(--blue);
  }

  .dash-row{
    display:flex;
    align-items:center;
    gap:18px;
    position:relative;
    z-index:1;
  }

  .dash-row .dash{
    width:60px;
    height:2px;
    background:var(--gold);
  }

  .contact-info p{
    position:relative;
    z-index:1;
    margin-top:26px;
    max-width:320px;
    color:var(--muted);
    font-size:14px;
    line-height:1.7;
  }

  @media (max-width:800px){
    .contact{ grid-template-columns:1fr; }
    .contact-info h2{ font-size:42px; }
    header{ padding:18px 24px; }
    .Nav-links{ gap:18px; }
  }
</style>
</head>
<body>

  <header>
    <div class="Nav-links">
      <a href="./index.html">Home</a>
      <a href="./About.html">About</a>
      <a href="./Service.html">Services</a>
      <a href="./Contact.html">Contact</a>
    </div>
    <a href="contact.html" class="hire-btn">Let's Talk</a>
  </header>

  <section class="contact">

    <!-- Left: form -->
    <form class="contact-form">
      <div class="field">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="field">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="message">Share your thoughts</label>
        <textarea id="message" name="message" rows="1" required></textarea>
      </div>

      <button type="submit" class="submit-btn">SHARE YOUR FEEDBACK</button>
    </form>

    <!-- Right: heading -->
    <div class="contact-info">
      <svg class="squiggle" viewBox="0 0 300 340" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M150 10C60 10 15 70 20 140C24 200 90 210 110 260C125 300 100 330 130 330C190 330 260 250 260 170C260 90 220 10 150 10Z"
              stroke="#8a8a8a" stroke-width="1.2"/>
      </svg>

      <h2>Contact</h2>
      <div class="dash-row">
        <span class="dash"></span>
        <h2 class="accent">Us</h2>
      </div>

      <p>
        It is very important for us to keep in touch with you,
        so we are always ready to answer any question that interests you. Shoot!
      </p>
    </div>

  </section>

</body>
</html>
