    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3c928;
    min-height: 100vh;
}

/* Main page */
.page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Contact black box */
.contact-box {
    width: 82%;
    max-width: 1100px;
    height: 570px;
    background: #171716;
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
}

/* Left navigation */
.side-menu {
    position: absolute;
    left: 25px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.side-menu a {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #777;
    color: white;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.side-menu .active {
    background: #f3c928;
    color: white;
}

/* Social icons */
.social-icons {
    position: absolute;
    top: 25px;
    right: 30px;
    display: flex;
    gap: 8px;
}

.social-icons a {
    width: 23px;
    height: 23px;
    border-radius: 50%;
    background: white;
    color: #222;
    text-decoration: none;
    font-size: 10px;
    font-weight: bold;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Form area */
.contact-form {
    position: absolute;
    left: 22%;
    top: 95px;
    width: 300px;
    z-index: 5;
}

.contact-form h1 {
    color: white;
    font-size: 25px;
    margin-bottom: 12px;
}

.contact-form h1 span {
    color: #f3c928;
}

.description {
    color: #aaa;
    font-size: 11px;
    line-height: 1.6;
    margin-bottom: 25px;
}

/* Labels */
form label {
    display: block;
    color: white;
    font-size: 10px;
    margin-bottom: 5px;
}

/* Input */
form input {
    width: 150px;
    height: 30px;
    background: #555;
    border: none;
    border-radius: 6px;
    outline: none;
    margin-bottom: 12px;
    padding: 5px 10px;
    color: white;
}

/* Text area */
form textarea {
    width: 150px;
    height: 75px;
    background: #555;
    border: none;
    border-radius: 8px;
    outline: none;
    resize: none;
    padding: 8px;
    color: white;
    font-size: 12px;
    margin-bottom: 12px;
}

form textarea::placeholder {
    color: #3eb91f;
}

/* Button */
form button {
    display: block;
    background: #f3c928;
    border: none;
    border-radius: 7px;
    padding: 7px 15px;
    font-size: 8px;
    font-weight: bold;
    cursor: pointer;
}

form button:hover {
    background: #fff;
}

/* Person section */
.person {
    position: absolute;
    right: 30px;
    bottom: 0;
    width: 430px;
    height: 430px;
}

/* Yellow background shape */
.yellow-shape {
    position: absolute;
    width: 290px;
    height: 290px;
    background: #f3c928;
    border-radius: 45% 55% 50% 50%;
    left: 70px;
    top: 80px;
    transform: rotate(15deg);
}

/* Person image */
.person img {
    position: absolute;
    width: 390px;
    height: auto;
    bottom: -5px;
    left: 0;
    z-index: 2;
}

/* Responsive */
@media (max-width: 800px) {

    .contact-box {
        width: 90%;
        height: 600px;
    }

    .contact-form {
        left: 15%;
    }

    .person {
        right: -80px;
        opacity: 0.8;
    }
}

@media (max-width: 600px) {

    .contact-box {
        height: 650px;
    }

    .contact-form {
        left: 80px;
        top: 80px;
    }

    .person {
        right: -130px;
        bottom: -20px;
    }

    .social-icons {
        right: 15px;
    }

}
</style>

             <section class="contact-section"></section>

    <div class="contact-form">

        <h1>Let's <span>talk</span></h1>

        <p>

            <input type="email">

            <label>Your Message</label>
            <textarea placeholder="Type your message here..."></textarea>

            <button type="submit">submit</button>

        </form>

    </div>

</section>
